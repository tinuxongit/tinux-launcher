name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    # Only run on tag pushes — main pushes are just for warming the build cache.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Tinux Launcher ${GITHUB_REF_NAME}" \
            --notes "Prebuilt Tinux Launcher binaries for pnpm installs."

  build:
    name: Build ${{ matrix.asset }}
    # On tag pushes, wait for the release to be created first. On main pushes,
    # the create-release job is skipped, so there's nothing to wait on.
    needs: create-release
    if: |
      always() &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: tinux-launcher-windows-x64.exe
            bin: target/release/tinux-launcher.exe
          # ubuntu-22.04 (not -latest) keeps the glibc baseline old enough
          # that the binary also runs on older distros.
          - os: ubuntu-22.04
            asset: tinux-launcher-linux-x64
            bin: target/release/tinux-launcher
          - os: ubuntu-22.04-arm
            asset: tinux-launcher-linux-arm64
            bin: target/release/tinux-launcher
          - os: macos-latest
            asset: tinux-launcher-macos-arm64
            bin: target/release/tinux-launcher
          # No free x64 macOS runners anymore (macos-13 retired); cross-compile
          # from the arm64 runner instead. Both archs share the same SDK.
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: tinux-launcher-macos-x64
            bin: target/x86_64-apple-darwin/release/tinux-launcher

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Add cross-compilation target
        if: matrix.target
        run: rustup target add ${{ matrix.target }}

      - name: Compute cache key
        id: cache-key
        shell: bash
        run: |
          # Strip the version line for our own workspace package from
          # Cargo.lock before hashing — otherwise every release-tag version
          # bump invalidates the cache and we eat a full ~4 min recompile.
          lock_hash=$(sed '/^name = "tinux-launcher"$/{n;/^version = /d;}' Cargo.lock | sha256sum | awk '{print $1}')
          rustc_hash=$(rustc -vV | sha256sum | awk '{print $1}')
          # matrix.asset disambiguates jobs that share a runner (the two
          # macos-latest builds would otherwise collide on one cache entry).
          echo "key=cargo-${{ matrix.asset }}-${rustc_hash:0:12}-${lock_hash:0:32}" >> "$GITHUB_OUTPUT"

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # Caches saved on main are visible to tag pushes because main is the
          # default branch. Caches saved on a tag would only be visible to that
          # same tag (and tags are unique per release), so without the main-push
          # warm-up the cache is effectively never reused.
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            cargo-${{ matrix.asset }}-

      - name: Build
        run: cargo build --release --locked ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Prepare asset
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.bin }}" "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}" || true
          # Checksum sidecar: the launcher's self-updater refuses to install
          # an asset whose .sha256 is missing or doesn't match.
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "dist/${{ matrix.asset }}" \
            "dist/${{ matrix.asset }}.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
